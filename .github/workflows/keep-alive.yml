name: Keep Render alive

on:
  schedule:
    # Render free services sleep after ~15 min of inactivity. Ping every 10.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://kendrickdavid.onrender.com/api/health